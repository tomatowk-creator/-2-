<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="簿記2級 ネット試験（CBT方式）を再現した模擬テストアプリケーション。ランダム出題で何度でも練習できます。">
  <title>簿記2級 CBT模擬試験</title>
  <style>
    /* ================================================================
   簿記2級 CBT模擬試験 - スタイルシート
   
   本番のCBT試験に近い、白黒・グレー基調のシンプルで視認性の高いUI。
   ブレークポイント: 768px（スマートフォン / PC）
   ================================================================ */

    /* ---- リセット & ベース ---- */
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      font-size: 16px;
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Meiryo", "Noto Sans JP", sans-serif;
      background-color: #f0f0f0;
      color: #333;
      line-height: 1.6;
      min-height: 100vh;
    }

    button {
      cursor: pointer;
      font-family: inherit;
      font-size: inherit;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    select,
    input {
      font-family: inherit;
      font-size: 16px;
      /* iOS Safariフォーカス時ズーム防止 */
      touch-action: manipulation;
    }

    /* ---- 画面切替 ---- */
    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    /* ================================================================
   スタート画面
   ================================================================ */
    #screen-start {
      display: none;
      min-height: 100vh;
      background: #fff;
    }

    #screen-start.active {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .start-container {
      max-width: 560px;
      width: 100%;
      padding: 40px 24px;
      text-align: center;
    }

    .start-title {
      font-size: 1.75rem;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 4px;
    }

    .start-subtitle {
      font-size: 0.95rem;
      color: #666;
      margin-bottom: 32px;
    }

    .start-info {
      text-align: left;
      margin-bottom: 32px;
      background: #fafafa;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      padding: 20px;
    }

    .start-info-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 16px;
    }

    .start-info-table th,
    .start-info-table td {
      padding: 8px 12px;
      border-bottom: 1px solid #e8e8e8;
      font-size: 0.9rem;
    }

    .start-info-table th {
      text-align: left;
      color: #555;
      font-weight: 600;
      width: 40%;
    }

    .start-info-table td {
      text-align: left;
      color: #1a1a1a;
      font-weight: 500;
    }

    .start-info-table tr:last-child th,
    .start-info-table tr:last-child td {
      border-bottom: none;
    }

    .start-breakdown-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: #555;
      margin-bottom: 8px;
      padding-top: 12px;
      border-top: 1px solid #e0e0e0;
    }

    .start-breakdown ul {
      list-style: none;
      padding: 0;
    }

    .start-breakdown li {
      font-size: 0.85rem;
      color: #444;
      padding: 3px 0;
      padding-left: 16px;
      position: relative;
    }

    .start-breakdown li::before {
      content: "─";
      position: absolute;
      left: 0;
      color: #aaa;
    }

    .btn-start {
      display: inline-block;
      padding: 14px 48px;
      background: #2c2c2c;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      transition: background 0.2s;
    }

    .btn-start:hover {
      background: #444;
    }

    .start-note {
      margin-top: 16px;
      font-size: 0.75rem;
      color: #999;
    }

    /* ================================================================
   試験画面 — Header（固定配置）
   ================================================================ */
    #exam-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 48px;
      padding: 0 12px;
      background: #2c2c2c;
      color: #fff;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
    }

    .header-left {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-home {
      padding: 4px 10px;
      background: #555;
      color: #fff;
      border: 1px solid #777;
      border-radius: 3px;
      font-size: 0.75rem;
      font-weight: 600;
      transition: background 0.2s;
    }

    .btn-home:hover {
      background: #777;
    }

    .header-title {
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .header-center {
      flex: 0 0 auto;
      text-align: center;
    }

    .timer {
      font-size: 1.3rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.05em;
      color: #fff;
    }

    .timer.warning {
      color: #e53935;
    }

    .header-right {
      flex: 1;
      text-align: right;
    }

    .btn-finish {
      padding: 6px 14px;
      background: #c62828;
      color: #fff;
      border: none;
      border-radius: 3px;
      font-size: 0.8rem;
      font-weight: 600;
      transition: background 0.2s;
    }

    .btn-finish:hover {
      background: #e53935;
    }

    /* ================================================================
   試験画面 — Main Contents（スクロール領域）
   ================================================================ */
    #exam-main {
      margin-top: 48px;
      /* header分 */
      margin-bottom: 96px;
      /* footer分 */
      padding: 16px;
      min-height: calc(100vh - 48px - 96px);
    }

    /* 小問番号ナビ */
    .sub-question-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      margin-bottom: 12px;
      background: #e8e8e8;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #444;
    }

    .sub-question-nav .sub-q-label {
      font-size: 0.85rem;
    }

    .sub-question-nav .sub-q-indicator {
      display: flex;
      gap: 6px;
    }

    .sub-question-nav .sub-q-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ccc;
      cursor: pointer;
      transition: background 0.15s;
    }

    .sub-question-nav .sub-q-dot.active {
      background: #2c2c2c;
    }

    .sub-question-nav .sub-q-dot.answered {
      background: #4caf50;
    }

    .sub-question-nav .sub-q-dot.flagged {
      border: 2px solid #ff9800;
    }

    /* 問題文エリア */
    .question-area {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 20px;
      margin-bottom: 12px;
    }

    .question-area h2 {
      font-size: 1.05rem;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 2px solid #2c2c2c;
    }

    .question-area p {
      margin-bottom: 10px;
      font-size: 0.9rem;
      line-height: 1.7;
    }

    /* ---- 仕訳問題（第1問）専用レイアウト ---- */
    .journal-question-text {
      font-size: 0.95rem;
      line-height: 1.7;
      margin-bottom: 20px;
      padding: 12px;
      background: #fafafa;
      border-left: 3px solid #2c2c2c;
    }

    .journal-entry-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 12px;
    }

    .journal-entry-table th {
      padding: 8px 6px;
      background: #2c2c2c;
      color: #fff;
      font-size: 0.8rem;
      font-weight: 600;
      text-align: center;
    }

    .journal-entry-table td {
      padding: 6px;
      border: 1px solid #ddd;
      vertical-align: middle;
    }

    .journal-entry-table .side-label {
      text-align: center;
      font-weight: 600;
      font-size: 0.8rem;
      color: #555;
      background: #f5f5f5;
      width: 30px;
    }

    .journal-entry-table select {
      width: 100%;
      padding: 6px 4px;
      border: 1px solid #ccc;
      border-radius: 3px;
      background: #fff;
      font-size: 0.85rem;
      appearance: auto;
    }

    .journal-entry-table input[type="text"] {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #ccc;
      border-radius: 3px;
      text-align: right;
      font-size: 0.85rem;
      font-variant-numeric: tabular-nums;
    }

    .journal-entry-table input[type="text"]:focus,
    .journal-entry-table select:focus {
      outline: none;
      border-color: #2c2c2c;
      box-shadow: 0 0 0 2px rgba(44, 44, 44, 0.15);
    }

    /* ---- 第2〜5問: contentHTML内の表・入力欄 ---- */
    .question-area table {
      width: 100%;
      border-collapse: collapse;
      margin: 12px 0;
    }

    .question-area table th,
    .question-area table td {
      padding: 8px 10px;
      border: 1px solid #ccc;
      font-size: 0.85rem;
    }

    .question-area table th {
      background: #f0f0f0;
      font-weight: 600;
      text-align: center;
    }

    .question-area table td {
      text-align: right;
    }

    .question-area table td.text-left {
      text-align: left;
    }

    .question-area table td.text-center {
      text-align: center;
    }

    /* contentHTML内の入力フィールド */
    .blank-input {
      display: inline-block;
      width: 140px;
      padding: 5px 8px;
      border: 1px solid #999;
      border-radius: 3px;
      text-align: right;
      font-size: 0.85rem;
      font-variant-numeric: tabular-nums;
      background: #fffff0;
    }

    .blank-input:focus {
      outline: none;
      border-color: #2c2c2c;
      box-shadow: 0 0 0 2px rgba(44, 44, 44, 0.15);
      background: #fff;
    }

    .blank-select {
      display: inline-block;
      min-width: 120px;
      padding: 5px 4px;
      border: 1px solid #999;
      border-radius: 3px;
      font-size: 0.85rem;
      background: #fffff0;
      appearance: auto;
    }

    .blank-select:focus {
      outline: none;
      border-color: #2c2c2c;
      box-shadow: 0 0 0 2px rgba(44, 44, 44, 0.15);
      background: #fff;
    }

    /* 見直しチェック */
    .review-check-area {
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .review-check-area label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      color: #666;
      cursor: pointer;
      user-select: none;
    }

    .review-check-area input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #ff9800;
      cursor: pointer;
    }

    /* ================================================================
   Footer Navigation（固定配置）
   ================================================================ */
    #exam-footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: #fff;
      border-top: 1px solid #ddd;
      box-shadow: 0 -1px 4px rgba(0, 0, 0, 0.08);
    }

    .footer-tabs {
      display: flex;
      border-bottom: 1px solid #e0e0e0;
    }

    .tab-btn {
      flex: 1;
      padding: 10px 0;
      background: #fafafa;
      border: none;
      border-right: 1px solid #e0e0e0;
      font-size: 0.8rem;
      font-weight: 600;
      color: #666;
      position: relative;
      transition: background 0.15s, color 0.15s;
    }

    .tab-btn:last-child {
      border-right: none;
    }

    .tab-btn.active {
      background: #2c2c2c;
      color: #fff;
    }

    .tab-btn:hover:not(.active) {
      background: #eee;
    }

    /* 未回答マーク（●） */
    .tab-btn .unanswered-mark {
      display: inline-block;
      width: 7px;
      height: 7px;
      background: #e53935;
      border-radius: 50%;
      margin-left: 4px;
      vertical-align: middle;
    }

    .tab-btn.active .unanswered-mark {
      background: #ff8a80;
    }

    .footer-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 12px;
    }

    .sub-nav-buttons {
      display: flex;
      gap: 8px;
    }

    .sub-nav-buttons button {
      padding: 6px 16px;
      background: #f5f5f5;
      border: 1px solid #ccc;
      border-radius: 3px;
      font-size: 0.78rem;
      font-weight: 600;
      color: #444;
      transition: background 0.15s;
    }

    .sub-nav-buttons button:hover {
      background: #e8e8e8;
    }

    .sub-nav-buttons button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-review {
      padding: 6px 16px;
      background: #fff;
      border: 1px solid #999;
      border-radius: 3px;
      font-size: 0.78rem;
      font-weight: 600;
      color: #444;
      transition: background 0.15s;
    }

    .btn-review:hover {
      background: #f5f5f5;
    }

    /* ================================================================
   モーダル共通
   ================================================================ */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 200;
      background: rgba(0, 0, 0, 0.5);
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background: #fff;
      border-radius: 6px;
      width: 90%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }

    .modal-confirm {
      max-height: none;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-bottom: 1px solid #e0e0e0;
    }

    .modal-title {
      font-size: 1rem;
      font-weight: 700;
      color: #1a1a1a;
    }

    .btn-modal-close {
      background: none;
      border: none;
      font-size: 1.3rem;
      color: #999;
      padding: 0 4px;
      line-height: 1;
      transition: color 0.15s;
    }

    .btn-modal-close:hover {
      color: #333;
    }

    .modal-body {
      padding: 16px 18px;
      overflow-y: auto;
      flex: 1;
    }

    .modal-body p {
      font-size: 0.9rem;
      margin-bottom: 8px;
    }

    .modal-warning {
      color: #c62828;
      font-weight: 600;
    }

    .modal-footer {
      padding: 12px 18px;
      border-top: 1px solid #e0e0e0;
      text-align: right;
    }

    .modal-footer-confirm {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .btn-modal-action {
      padding: 8px 20px;
      background: #2c2c2c;
      color: #fff;
      border: none;
      border-radius: 3px;
      font-size: 0.85rem;
      font-weight: 600;
      transition: background 0.2s;
    }

    .btn-modal-action:hover {
      background: #444;
    }

    .btn-modal-cancel {
      padding: 8px 20px;
      background: #f5f5f5;
      color: #444;
      border: 1px solid #ccc;
      border-radius: 3px;
      font-size: 0.85rem;
      font-weight: 600;
      transition: background 0.15s;
    }

    .btn-modal-cancel:hover {
      background: #e8e8e8;
    }

    /* ---- 見直し一覧のリスト ---- */
    .review-list-section {
      margin-bottom: 16px;
    }

    .review-list-section-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: #1a1a1a;
      padding: 6px 0;
      margin-bottom: 4px;
      border-bottom: 1px solid #e0e0e0;
    }

    .review-list-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 8px;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
      transition: background 0.1s;
      border-radius: 3px;
    }

    .review-list-item:hover {
      background: #f5f5f5;
    }

    .review-list-item-label {
      font-size: 0.82rem;
      color: #333;
    }

    .review-list-item-status {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 10px;
    }

    .status-unanswered {
      background: #ffebee;
      color: #c62828;
    }

    .status-answered {
      background: #e8f5e9;
      color: #2e7d32;
    }

    .status-flagged {
      background: #fff3e0;
      color: #e65100;
    }

    /* ================================================================
   採点結果画面
   ================================================================ */
    #screen-result {
      min-height: 100vh;
      background: #f0f0f0;
      padding: 20px 16px;
    }

    .result-container {
      max-width: 720px;
      margin: 0 auto;
    }

    .result-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: #1a1a1a;
      text-align: center;
      margin-bottom: 24px;
    }

    /* 合計得点・合否 */
    .result-summary {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 24px;
      text-align: center;
      margin-bottom: 20px;
    }

    .result-total-score {
      font-size: 2.4rem;
      font-weight: 700;
      color: #1a1a1a;
    }

    .result-total-score span {
      font-size: 1rem;
      font-weight: 400;
      color: #666;
    }

    .result-pass {
      display: inline-block;
      margin-top: 12px;
      padding: 6px 24px;
      border-radius: 4px;
      font-size: 1rem;
      font-weight: 700;
    }

    .result-pass.pass {
      background: #e8f5e9;
      color: #2e7d32;
      border: 2px solid #4caf50;
    }

    .result-pass.fail {
      background: #ffebee;
      color: #c62828;
      border: 2px solid #e53935;
    }

    /* 大問ごとの得点 */
    .result-breakdown {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 16px 20px;
      margin-bottom: 20px;
    }

    .result-breakdown h2 {
      font-size: 0.95rem;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 12px;
    }

    .result-breakdown-table {
      width: 100%;
      border-collapse: collapse;
    }

    .result-breakdown-table th,
    .result-breakdown-table td {
      padding: 8px 10px;
      border-bottom: 1px solid #e8e8e8;
      font-size: 0.85rem;
    }

    .result-breakdown-table th {
      text-align: left;
      color: #555;
      font-weight: 600;
    }

    .result-breakdown-table td {
      text-align: center;
      font-weight: 500;
    }

    .result-breakdown-table td.score-cell {
      font-weight: 700;
      color: #1a1a1a;
    }

    .result-breakdown-table tr:last-child th,
    .result-breakdown-table tr:last-child td {
      border-bottom: none;
    }

    .result-breakdown-bar {
      display: inline-block;
      height: 8px;
      background: #4caf50;
      border-radius: 4px;
      vertical-align: middle;
      margin-right: 6px;
    }

    /* 詳細: 不正解箇所 */
    .result-details {
      margin-bottom: 24px;
    }

    .result-detail-section {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 16px 20px;
      margin-bottom: 16px;
    }

    .result-detail-section h3 {
      font-size: 0.95rem;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 2px solid #2c2c2c;
    }

    .result-detail-section h4 {
      font-size: 0.85rem;
      font-weight: 600;
      color: #444;
      margin: 14px 0 8px;
    }

    /* 仕訳結果テーブル */
    .result-journal-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 12px;
      font-size: 0.82rem;
    }

    .result-journal-table th {
      padding: 6px 8px;
      background: #f0f0f0;
      border: 1px solid #ddd;
      font-weight: 600;
      text-align: center;
    }

    .result-journal-table td {
      padding: 6px 8px;
      border: 1px solid #ddd;
    }

    /* 正解・不正解のハイライト */
    .result-correct {
      background: #e8f5e9;
    }

    .result-incorrect {
      background: #ffebee;
    }

    .result-answer-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 6px;
      font-size: 0.82rem;
      padding: 6px 8px;
      border-radius: 3px;
    }

    .result-answer-row.correct {
      background: #e8f5e9;
    }

    .result-answer-row.incorrect {
      background: #ffebee;
    }

    .result-answer-label {
      font-weight: 600;
      color: #555;
      min-width: 70px;
    }

    .result-answer-yours {
      color: #c62828;
    }

    .result-answer-correct {

    /* ================================================================
       簿記2級 CBT模擬試験 - スプレッドシート連携ローダー
       (spreadsheet-loader.js)
    
       Googleスプレッドシート ＋ GAS (Google Apps Script) から
       問題データを取得し、既存の questionBank 形式に変換するモジュール。
    
       通信失敗時は data.js のハードコーディングデータにフォールバック。
       ================================================================ */

    // ★★★ GASデプロイ後のURLをここに貼り付けてください ★★★
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbypmaNC7BcneDav6JwMI7HygFPFDGeSddCumYpeOSOgolHqR5RMldZIGwPr_qYANBBr/exec';

    // データソース状態: 'local' | 'spreadsheet' | 'loading'
    let dataSource = 'local';

    // 学習履歴キャッシュ（スプレッドシートから取得した is_starred 情報）
    let learningHistory = {};

    /**
     * スプレッドシートから全データを一括取得し、グローバル変数を上書き
     * @returns {Promise<boolean>} 成功時true、失敗時false（フォールバック使用）
     */
    async function loadFromSpreadsheet() {
      if (!GAS_URL) {
        console.log('[Loader] GAS_URL未設定。ローカルデータを使用します。');
        dataSource = 'local';
        updateDataSourceBadge();
        return false;
      }

      dataSource = 'loading';
      updateDataSourceBadge();

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 10000); // 10秒タイムアウト

      try {
        const res = await fetch(GAS_URL + '?sheet=all', { signal: controller.signal });
        clearTimeout(timeoutId);
        const text = await res.text();
        const raw = JSON.parse(text);

        // ── 仕訳問題 → questionBank.q1_journal ──
        if (raw['仕訳問題'] && raw['仕訳問題'].length > 0) {
          const journalData = parseJournalData(raw['仕訳問題']);
          if (journalData.length > 0) {
            questionBank.q1_journal = journalData;
            console.log('[Loader] 仕訳問題: ' + journalData.length + '問 ロード完了');
          }
        }

        // ── 商業簿記_総合 → q2_commercial + q3_commercial_closing ──
        if (raw['商業簿記_総合'] && raw['商業簿記_総合'].length > 0) {
          const commercialData = parseBigQuestionData(raw['商業簿記_総合']);
          if (commercialData.q2.length > 0) {
            questionBank.q2_commercial = commercialData.q2;
            console.log('[Loader] 第2問: ' + commercialData.q2.length + '問 ロード完了');
          }
          if (commercialData.q3.length > 0) {
            questionBank.q3_commercial_closing = commercialData.q3;
            console.log('[Loader] 第3問: ' + commercialData.q3.length + '問 ロード完了');
          }
        }

        // ── 工業簿記_総合 → q4_industrial + q5_industrial ──
        if (raw['工業簿記_総合'] && raw['工業簿記_総合'].length > 0) {
          const industrialData = parseBigQuestionData(raw['工業簿記_総合']);
          if (industrialData.q4.length > 0) {
            questionBank.q4_industrial = industrialData.q4;
            console.log('[Loader] 第4問: ' + industrialData.q4.length + '問 ロード完了');
          }
          if (industrialData.q5.length > 0) {
            questionBank.q5_industrial = industrialData.q5;
            console.log('[Loader] 第5問: ' + industrialData.q5.length + '問 ロード完了');
          }
        }

        // ── 勘定科目マスタ → accountList + confusableGroups ──
        if (raw['勘定科目マスタ'] && raw['勘定科目マスタ'].length > 0) {
          const masterData = parseAccountMaster(raw['勘定科目マスタ']);
          if (masterData.accounts.length > 0) {
            accountList.length = 0;
            masterData.accounts.forEach(a => accountList.push(a));
            console.log('[Loader] 勘定科目: ' + masterData.accounts.length + '科目 ロード完了');
          }
          if (masterData.groups.length > 0) {
            confusableGroups.length = 0;
            masterData.groups.forEach(g => confusableGroups.push(g));
            console.log('[Loader] 混同グループ: ' + masterData.groups.length + 'グループ ロード完了');
          }
        }

        // ── 学習履歴 → learningHistory キャッシュ ──
        if (raw['学習履歴'] && raw['学習履歴'].length > 0) {
          raw['学習履歴'].forEach(row => {
            const qid = String(row.question_id || '').trim();
            if (qid) {
              learningHistory[qid] = {
                is_starred: row.is_starred === true || String(row.is_starred).toUpperCase() === 'TRUE',
                attempt_count: Number(row.attempt_count) || 0,
                correct_count: Number(row.correct_count) || 0,
                last_result: String(row.last_result || '')
              };
            }
          });
          console.log('[Loader] 学習履歴: ' + Object.keys(learningHistory).length + '件 ロード完了');
        }

        dataSource = 'spreadsheet';
        updateDataSourceBadge();
        console.log('[Loader] ✅ スプレッドシートからデータを正常に取得しました');
        return true;

      } catch (err) {
        clearTimeout(timeoutId);
        console.warn('[Loader] ⚠️ スプレッドシート接続失敗。ローカルデータを使用します。', err.message);
        dataSource = 'local';
        updateDataSourceBadge();
        return false;
      }
    }

    // ================================================================
    // データ変換関数
    // ================================================================

    /**
     * 仕訳問題シートの行データ → questionBank.q1_journal 形式に変換
     *
     * スプレッドシート列: id, text, explanation,
     *   debit_account_1, debit_amount_1, debit_account_2, debit_amount_2,
     *   credit_account_1, credit_amount_1, credit_account_2, credit_amount_2,
     *   credit_account_3, credit_amount_3
     *
     * 変換先: { id, text, explanation, answers: [{ side, account, amount }] }
     */
    function parseJournalData(rows) {
      return rows.map(row => {
        const answers = [];

        // 借方（最大2行）
        for (let i = 1; i <= 2; i++) {
          const acc = row['debit_account_' + i];
          const amt = row['debit_amount_' + i];
          if (acc && String(acc).trim() !== '' && amt !== '' && amt !== null && amt !== undefined) {
            answers.push({
              side: 'debit',
              account: String(acc).trim(),
              amount: Number(amt)
            });
          }
        }

        // 貸方（最大3行）
        for (let i = 1; i <= 3; i++) {
          const acc = row['credit_account_' + i];
          const amt = row['credit_amount_' + i];
          if (acc && String(acc).trim() !== '' && amt !== '' && amt !== null && amt !== undefined) {
            answers.push({
              side: 'credit',
              account: String(acc).trim(),
              amount: Number(amt)
            });
          }
        }

        return {
          id: String(row.id || '').trim(),
          text: String(row.text || '').trim(),
          explanation: String(row.explanation || '').trim(),
          answers: answers
        };
      }).filter(q => q.id && q.answers.length > 0);
    }

    /**
     * 商業/工業簿記_総合シートの行データ → question_type別に振り分け
     *
     * スプレッドシート列: id, question_type, title, points, explanation,
     *   ans_1_id, ans_1_correct, ans_1_points, ..., ans_4_id, ans_4_correct, ans_4_points
     *
     * question_type の値:
     *   'q2_commercial', 'q3_commercial_closing', 'q4_industrial', 'q5_industrial'
     */
    function parseBigQuestionData(rows) {
      const result = { q2: [], q3: [], q4: [], q5: [] };

      rows.forEach(row => {
        const type = String(row.question_type || '').trim();
        const questionId = String(row.id || '').trim();
        if (!questionId) return;

        const answerForm = [];
        for (let i = 1; i <= 4; i++) {
          const ansId = row['ans_' + i + '_id'];
          const ansCorrect = row['ans_' + i + '_correct'];
          const ansPoints = row['ans_' + i + '_points'];

          if (ansId && String(ansId).trim() !== '') {
            answerForm.push({
              id: String(ansId).trim(),
              type: 'number',
              correctAnswer: Number(ansCorrect),
              points: Number(ansPoints) || 5
            });
          }
        }

        // contentHTMLは既存data.jsからIDマッチで取得。なければ自動生成。
        let contentHTML = '';
        const existingQ = findExistingQuestion(questionId);
        if (existingQ && existingQ.contentHTML) {
          contentHTML = existingQ.contentHTML;
        } else {
          contentHTML = generateContentHTML(answerForm, String(row.title || ''));
        }

        const question = {
          id: questionId,
          title: String(row.title || '').trim(),
          points: Number(row.points) || 20,
          explanation: String(row.explanation || '').trim(),
          contentHTML: contentHTML,
          answerForm: answerForm
        };

        if (type === 'q2_commercial') result.q2.push(question);
        else if (type === 'q3_commercial_closing') result.q3.push(question);
        else if (type === 'q4_industrial') result.q4.push(question);
        else if (type === 'q5_industrial') result.q5.push(question);
      });

      return result;
    }

    /**
     * 既存の questionBank からIDで問題を検索（contentHTML テンプレート取得用）
     */
    function findExistingQuestion(id) {
      const pools = [
        questionBank.q2_commercial,
        questionBank.q3_commercial_closing,
        questionBank.q4_industrial,
        questionBank.q5_industrial
      ];

      for (const pool of pools) {
        if (!pool) continue;
        for (const q of pool) {
          if (q.id === id) return q;
        }
      }
      return null;
    }

    /**
     * answerForm から contentHTML を自動生成
     * （既存テンプレートが存在しない新規問題用のフォールバック）
     */
    function generateContentHTML(answerForm, title) {
      let html = '<p>以下の資料に基づき、解答欄の空欄を埋めなさい。</p>';
      html += '<p><strong>' + (title || '演習問題') + '</strong></p>';
      html += '<table><thead><tr><th class="text-left">対象項目</th><th>計算結果金額</th></tr></thead><tbody>';

      answerForm.forEach((field, index) => {
        html += '<tr><td class="text-left">' + (index + 1) + '. 解答欄</td>';
        html += '<td>{{blank:' + field.id + '}}</td></tr>';
      });

      html += '</tbody></table>';
      return html;
    }

    /**
     * 勘定科目マスタシート → accountList + confusableGroups に変換
     *
     * スプレッドシート列: account_name, category, confusable_group
     * confusable_group はカンマ区切りで複数グループに所属可能（例: "1,5,8"）
     */
    function parseAccountMaster(rows) {
      const accounts = [];
      const groupMap = {}; // groupNumber → Set of account names

      rows.forEach(row => {
        const name = String(row.account_name || '').trim();
        if (!name) return;

        accounts.push(name);

        const groupStr = String(row.confusable_group || '').trim();
        if (groupStr) {
          groupStr.split(',').forEach(g => {
            const groupNum = g.trim();
            if (groupNum) {
              if (!groupMap[groupNum]) groupMap[groupNum] = new Set();
              groupMap[groupNum].add(name);
            }
          });
        }
      });

      // groupMap を confusableGroups 形式（配列の配列）に変換
      const groups = Object.keys(groupMap)
        .sort((a, b) => Number(a) - Number(b))
        .map(key => Array.from(groupMap[key]));

      return { accounts, groups };
    }

    // ================================================================
    // 学習履歴の送信（バックグラウンド非同期）
    // ================================================================

    /**
     * 復習フラグ（is_starred）をトグル送信
     */
    function sendStarToggle(questionId) {
      if (!GAS_URL) return;

      const url = GAS_URL + '?action=star&id=' + encodeURIComponent(questionId);
      // no-cors: GASリダイレクトの CORS エラー回避
      fetch(url, { mode: 'no-cors' }).catch(err => {
        console.warn('[Loader] ★トグル送信失敗:', err.message);
      });
    }

    /**
     * 採点結果を送信
     * @param {string} questionId - 問題ID
     * @param {boolean} isCorrect - 正解かどうか
     */
    function sendResult(questionId, isCorrect) {
      if (!GAS_URL) return;

      const url = GAS_URL + '?action=result&id=' + encodeURIComponent(questionId) +
        '&result=' + (isCorrect ? 'correct' : 'incorrect');
      fetch(url, { mode: 'no-cors' }).catch(err => {
        console.warn('[Loader] 結果送信失敗:', err.message);
      });
    }

    /**
     * 複数問題の採点結果を一括送信（採点完了時に呼び出し）
     * @param {Array<{id: string, correct: boolean}>} results
     */
    function sendResultsBatch(results) {
      if (!GAS_URL || !results || results.length === 0) return;

      // 各問題の結果を個別に非同期送信（GASは並列処理不可のため順次）
      results.forEach((r, index) => {
        setTimeout(() => {
          sendResult(r.id, r.correct);
        }, index * 200); // 200msずつずらして負荷軽減
      });
    }

    /* ================================================================
       簿記2級 CBT模擬試験 - メインロジック (app.js)
    
       【永続化方針】
       本番のテストセンター試験を再現するため、localStorage等による
       保存は一切行わない。ページをリロードすると進行状況は失われ、
       新しい問題セットで最初からやり直しとなる。
    
       【状態管理】
       アプリケーション全体の状態は state オブジェクト1つで一元管理する。
       タブを切り替えても、入力済みの解答・見直しチェックの状態は保持される。
    
       【タイマー実装】
       setIntervalだけに頼らず、開始時刻(Date.now())を記録し、
       経過時間を都度計算して残り時間を算出する方式
       （タブが非アクティブでも誤差が出ない）。
       ================================================================ */

    (function () {
      "use strict";

      // ============================================================
      // 定数
      // ============================================================
      const EXAM_DURATION_MS = 90 * 60 * 1000; // 90分
      const WARNING_THRESHOLD_MS = 10 * 60 * 1000; // 残り10分で警告
      const Q1_COUNT = 5; // 第1問の出題数
      const Q1_POINTS = 4; // 第1問の1問あたり配点

      // ============================================================
      // アプリケーション状態（一元管理オブジェクト）
      // ============================================================
      let state = null;
      let previousExamIds = null; // やり直し時の重複回避用

      let wrongQuestionsHistory = []; // 直近で間違えた問題のIDリスト

      /**
       * 初期状態オブジェクトを生成
       */
      function createInitialState() {
        return {
          mode: "exam", // "exam" | "training"
          currentTab: 1, // 現在表示中の大問番号 (1-5)
          currentSubQ: 0, // 現在表示中の小問インデックス (0-based)
          startTime: null, // 試験開始時刻 (Date.now())
          timerInterval: null, // setIntervalのID
          exam: {
            q1: [],
            q2: [],
            q3: [],
            q4: [],
            q5: [],
          },
          answers: {}, // ユーザーの回答（キー: フィールドID, 値: 入力値）
          reviewFlags: {}, // 見直しフラグ（キー: "q{大問}-{小問index}", 値: boolean）
          checkedQuestions: {}, // トレーニングモード用：解説チェック済みフラグ
          isFinished: false, // 試験終了フラグ
        };
      }

      // ============================================================
      // ユーティリティ
      // ============================================================

      /** 配列をシャッフル（Fisher-Yates） */
      function shuffleArray(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      // ============================================================
      // 第1問 プルダウン選択肢の動的生成
      //
      // 本番CBT同様、正解の勘定科目＋間違いやすいダミー科目を
      // 合計8〜12個程度に絞り込んで出題する。
      // confusableGroups（data.js）を参照し、正解科目と混同しやすい
      // 科目を自動的にピックアップする。
      // ============================================================
      const Q1_CHOICES_TARGET = 10; // 目標選択肢数

      /**
       * 指定した勘定科目に対して、混同しやすい科目の一覧を返す
       */
      function getConfusables(account) {
        var result = new Set();
        for (var g = 0; g < confusableGroups.length; g++) {
          var group = confusableGroups[g];
          if (group.indexOf(account) !== -1) {
            for (var i = 0; i < group.length; i++) {
              if (group[i] !== account) result.add(group[i]);
            }
          }
        }
        return result;
      }

      /**
       * 仕訳問題の正解科目から、本番CBT風のプルダウン選択肢を動的に生成する
       * - 正解科目はすべて含める
       * - 各正解科目の混同しやすい科目をダミーとして追加
       * - 不足分はaccountListからランダムに補充
       * - 最終的にシャッフルして返す
       */
      function generateQ1Choices(question) {
        // 正解に使われている勘定科目（重複除去）
        var correctSet = new Set();
        for (var a = 0; a < question.answers.length; a++) {
          correctSet.add(question.answers[a].account);
        }

        // 各正解科目の混同しやすい科目をプール
        var confusablePool = new Set();
        correctSet.forEach(function (acc) {
          var confs = getConfusables(acc);
          confs.forEach(function (c) {
            if (!correctSet.has(c)) confusablePool.add(c);
          });
        });

        // 必要なダミー数を計算
        var needed = Math.max(0, Q1_CHOICES_TARGET - correctSet.size);

        // 混同しやすい科目をシャッフルして必要数取得
        var confusableArr = shuffleArray(Array.from(confusablePool));
        var selected = confusableArr.slice(0, needed);

        // 混同科目だけでは足りない場合、accountListからランダム補充
        if (selected.length < needed) {
          var remaining = needed - selected.length;
          var usedSet = new Set(selected);
          correctSet.forEach(function (c) { usedSet.add(c); });
          confusablePool.forEach(function (c) { usedSet.add(c); });

          var extras = shuffleArray(
            accountList.filter(function (a) { return !usedSet.has(a); })
          );
          for (var e = 0; e < Math.min(remaining, extras.length); e++) {
            selected.push(extras[e]);
          }
        }

        // 正解 + ダミーを結合してシャッフル
        var choices = Array.from(correctSet).concat(selected);
        return shuffleArray(choices);
      }

      /** 金額文字列のカンマを除去してintにパース */
      function parseAmount(str) {
        if (str === "" || str === undefined || str === null) return NaN;
        const cleaned = String(str).replace(/,/g, "");
        if (cleaned === "" || cleaned === "-") return NaN;
        return parseInt(cleaned, 10);
      }

      /** 数値を3桁区切りカンマ付き文字列に変換 */
      function formatNumber(value) {
        const raw = String(value).replace(/,/g, "");
        if (raw === "" || raw === "-") return raw;
        const num = parseInt(raw, 10);
        if (isNaN(num)) return "";
        return num.toLocaleString();
      }

      // ============================================================
      // 問題抽出ロジック
      // ============================================================

      /**
       * questionBankから今回のテストセットを抽出する
       * @param {Object|null} prevIds - 前回の出題IDセット（重複回避用）
       */
      function selectQuestions(prevIds) {
        const exam = {};

        // 第1問: プールからランダムに5問、重複なし
        const q1Pool = shuffleArray(questionBank.q1_journal);
        exam.q1 = q1Pool.slice(0, Math.min(Q1_COUNT, q1Pool.length));

        // 第2問: ランダムに1問
        exam.q2 = [pickRandom(questionBank.q2_commercial, prevIds?.q2)];

        // 第3問: ランダムに1問
        exam.q3 = [pickRandom(questionBank.q3_commercial_closing, prevIds?.q3)];

        // 第4問: 合計20点になる組み合わせで1〜2問
        exam.q4 = selectQ4(questionBank.q4_industrial, prevIds?.q4);

        // 第5問: ランダムに1問
        exam.q5 = [pickRandom(questionBank.q5_industrial, prevIds?.q5)];

        return exam;
      }

      /**
       * トレーニングモード用の問題を抽出
       */
      function selectTrainingQuestions(type, category, countStr) {
        const exam = { q1: [], q2: [], q3: [], q4: [], q5: [] };

        // 全問題を1つのリストに集約
        let pool = [];
        if (type === "category") {
          if (category === "q1") pool = questionBank.q1_journal;
          else if (category === "q2") pool = questionBank.q2_commercial;
          else if (category === "q3") pool = questionBank.q3_commercial_closing;
          else if (category === "q4") pool = questionBank.q4_industrial;
          else if (category === "q5") pool = questionBank.q5_industrial;
        } else if (type === "random") {
          pool = [
            ...questionBank.q1_journal,
            ...questionBank.q2_commercial,
            ...questionBank.q3_commercial_closing,
            ...questionBank.q4_industrial,
            ...questionBank.q5_industrial
          ];
        } else if (type === "review") {
          const allQuestions = [
            ...questionBank.q1_journal,
            ...questionBank.q2_commercial,
            ...questionBank.q3_commercial_closing,
            ...questionBank.q4_industrial,
            ...questionBank.q5_industrial
          ];
          pool = allQuestions.filter(q => wrongQuestionsHistory.includes(q.id));
          if (pool.length === 0) {
            alert("復習対象の問題（過去に間違えた問題）がありません。全問題から出題します。");
            pool = allQuestions;
          }
        }

        let shuffled = shuffleArray(pool);
        if (countStr !== "all") {
          const cnt = parseInt(countStr, 10);
          shuffled = shuffled.slice(0, cnt);
        }

        // 大問ごとに振り分け
        shuffled.forEach(q => {
          if (questionBank.q1_journal.some(item => item.id === q.id)) exam.q1.push(q);
          else if (questionBank.q2_commercial.some(item => item.id === q.id)) exam.q2.push(q);
          else if (questionBank.q3_commercial_closing.some(item => item.id === q.id)) exam.q3.push(q);
          else if (questionBank.q4_industrial.some(item => item.id === q.id)) exam.q4.push(q);
          else if (questionBank.q5_industrial.some(item => item.id === q.id)) exam.q5.push(q);
        });

        return exam;
      }

      /**
       * プールからランダムに1問抽出（前回と異なるものを優先）
       */
      function pickRandom(pool, prevId) {
        if (!pool || pool.length === 0) return null;
        if (pool.length === 1) return pool[0];

        const filtered = prevId ? pool.filter((q) => q.id !== prevId) : pool;
        const source = filtered.length > 0 ? filtered : pool;
        return source[Math.floor(Math.random() * source.length)];
      }

      /**
       * 第4問: 合計20点になる問題の組み合わせを選択
       */
      function selectQ4(pool, prevQ4Ids) {
        if (!pool || pool.length === 0) return [];

        const combinations = [];

        // パターン1: 20点の単独問題
        pool.forEach((q) => {
          if (q.points === 20) combinations.push([q]);
        });

        // パターン2: 2問の組み合わせで合計20点
        for (let i = 0; i < pool.length; i++) {
          for (let j = i + 1; j < pool.length; j++) {
            if (pool[i].points + pool[j].points === 20) {
              combinations.push([pool[i], pool[j]]);
            }
          }
        }

        if (combinations.length === 0) return [pool[0]]; // フォールバック

        // 前回と異なる組み合わせを優先
        if (prevQ4Ids && combinations.length > 1) {
          const prevSet = prevQ4Ids.sort().join(",");
          const diff = combinations.filter((combo) => {
            return combo.map((q) => q.id).sort().join(",") !== prevSet;
          });
          if (diff.length > 0) {
            return diff[Math.floor(Math.random() * diff.length)];
          }
        }

        return combinations[Math.floor(Math.random() * combinations.length)];
      }

      /**
       * 出題IDのセットを取得（やり直し時の重複回避用）
       */
      function getExamIds(exam) {
        return {
          q1: exam.q1.map((q) => q.id),
          q2: exam.q2[0]?.id,
          q3: exam.q3[0]?.id,
          q4: exam.q4.map((q) => q.id),
          q5: exam.q5[0]?.id,
        };
      }

      // ============================================================
      // タイマー
      // 開始時刻を記録し、経過時間から残りを算出する方式
      // （タブ非アクティブ時の setInterval 遅延に強い）
      // ============================================================

      function startTimer() {
        state.startTime = Date.now();
        updateTimerDisplay();
        state.timerInterval = setInterval(updateTimerDisplay, 250); // 250ms間隔で精度向上
      }

      function stopTimer() {
        if (state.timerInterval) {
          clearInterval(state.timerInterval);
          state.timerInterval = null;
        }
      }

      function updateTimerDisplay() {
        const elapsed = Date.now() - state.startTime;
        const remaining = Math.max(0, EXAM_DURATION_MS - elapsed);

        const totalSeconds = Math.ceil(remaining / 1000);
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;

        const display =
          String(minutes).padStart(2, "0") + ":" + String(seconds).padStart(2, "0");
        const timerEl = document.getElementById("timer-display");
        timerEl.textContent = display;

        // 残り10分で赤文字
        if (remaining <= WARNING_THRESHOLD_MS) {
          timerEl.classList.add("warning");
        } else {
          timerEl.classList.remove("warning");
        }

        // 残り0で強制終了 → 未回答は不正解扱い
        if (remaining <= 0) {
          finishExam(true);
        }
      }

      // ============================================================
      // 画面切替
      // ============================================================

      function showScreen(screenId) {
        document.querySelectorAll(".screen").forEach((s) => s.classList.remove("active"));
        document.getElementById(screenId).classList.add("active");
      }

      // ============================================================
      // 金額入力フィールドの制御
      //  - 数字とハイフン（マイナス）以外は入力不可
      //  - blur時にカンマ付きフォーマット
      //  - focus時にカンマ除去（編集しやすく）
      // ============================================================

      function setupNumberInputs(container) {
        container.querySelectorAll('input[inputmode="numeric"]').forEach((input) => {
          input.addEventListener("input", function () {
            // 数字・ハイフン・カンマ以外を除去
            let val = this.value.replace(/[^\d\-,]/g, "");
            // ハイフンは先頭のみ許可
            const hasLeadingMinus = val.charAt(0) === "-";
            val = val.replace(/-/g, "");
            if (hasLeadingMinus) val = "-" + val;
            this.value = val;
          });

          input.addEventListener("focus", function () {
            // フォーカス時: カンマ除去して生の数値のみ表示
            this.value = this.value.replace(/,/g, "");
          });

          input.addEventListener("blur", function () {
            // フォーカスが外れた時: 3桁区切りカンマにフォーマット
            const raw = this.value.replace(/,/g, "");
            if (raw !== "" && raw !== "-") {
              this.value = formatNumber(raw);
            }
          });
        });
      }

      // ============================================================
      // 回答の保存・復元
      // タブや小問を切り替えても回答が保持されるようにする
      // ============================================================

      /** 現在表示中の問題の回答を state.answers に保存 */
      function saveCurrentAnswers() {
        if (!state || state.isFinished) return;
        const tab = state.currentTab;
        const subQ = state.currentSubQ;

        if (tab === 1) {
          saveQ1Answers(subQ);
        } else {
          const questions = state.exam["q" + tab];
          if (questions && questions[subQ]) {
            saveBigQAnswers(questions[subQ]);
          }
        }
      }

      /** 第1問: 仕訳の各行の入力値を保存 */
      function saveQ1Answers(subIndex) {
        const question = state.exam.q1[subIndex];
        if (!question) return;

        const debitCount = question.answers.filter((a) => a.side === "debit").length;
        const creditCount = question.answers.filter((a) => a.side === "credit").length;
        const rowCount = Math.max(debitCount, creditCount);

        for (let r = 0; r < rowCount; r++) {
          ["debit", "credit"].forEach((side) => {
            const accEl = document.getElementById(
              "q1-" + subIndex + "-" + side + "-" + r + "-account"
            );
            const amtEl = document.getElementById(
              "q1-" + subIndex + "-" + side + "-" + r + "-amount"
            );
            if (accEl) {
              state.answers["q1-" + subIndex + "-" + side + "-" + r + "-account"] =
                accEl.value;
            }
            if (amtEl) {
              state.answers["q1-" + subIndex + "-" + side + "-" + r + "-amount"] =
                amtEl.value.replace(/,/g, "");
            }
          });
        }
      }

      /** 第1問: 保存済み回答をフォームに復元 */
      function restoreQ1Answers(subIndex, rowCount) {
        for (let r = 0; r < rowCount; r++) {
          ["debit", "credit"].forEach((side) => {
            const accKey = "q1-" + subIndex + "-" + side + "-" + r + "-account";
            const amtKey = "q1-" + subIndex + "-" + side + "-" + r + "-amount";
            const accEl = document.getElementById(accKey);
            const amtEl = document.getElementById(amtKey);

            if (accEl && state.answers[accKey] !== undefined) {
              accEl.value = state.answers[accKey];
            }
            if (amtEl && state.answers[amtKey] !== undefined) {
              const val = state.answers[amtKey];
              amtEl.value = val !== "" ? formatNumber(val) : "";
            }
          });
        }
      }

      /** 第2〜5問: 各blankの入力値を保存 */
      function saveBigQAnswers(question) {
        if (!question || !question.answerForm) return;
        question.answerForm.forEach((field) => {
          const el = document.getElementById(field.id);
          if (el) {
            state.answers[field.id] =
              field.type === "number"
                ? el.value.replace(/,/g, "")
                : el.value;
          }
        });
      }

      /** 第2〜5問: 保存済み回答をフォームに復元 */
      function restoreBigQAnswers(question) {
        if (!question || !question.answerForm) return;
        question.answerForm.forEach((field) => {
          const el = document.getElementById(field.id);
          if (el && state.answers[field.id] !== undefined) {
            const val = state.answers[field.id];
            if (field.type === "number") {
              el.value = val !== "" ? formatNumber(val) : "";
            } else {
              el.value = val;
            }
          }
        });
      }

      // ============================================================
      // 回答状況チェック（未回答判定）
      // ============================================================

      /** 第1問の小問が回答済みか（1つでもフィールドに入力があればtrue） */
      function isQ1SubAnswered(subIndex) {
        const question = state.exam.q1[subIndex];
        if (!question) return false;

        const debitCount = question.answers.filter((a) => a.side === "debit").length;
        const creditCount = question.answers.filter((a) => a.side === "credit").length;
        const rowCount = Math.max(debitCount, creditCount);

        for (let r = 0; r < rowCount; r++) {
          for (const side of ["debit", "credit"]) {
            const accVal =
              state.answers["q1-" + subIndex + "-" + side + "-" + r + "-account"];
            const amtVal =
              state.answers["q1-" + subIndex + "-" + side + "-" + r + "-amount"];
            if (accVal && accVal !== "") return true;
            if (amtVal && amtVal !== "") return true;
          }
        }
        return false;
      }

      /** 第2〜5問の小問が回答済みか */
      function isBigQSubAnswered(tabNum, subIndex) {
        const questions = state.exam["q" + tabNum];
        const question = questions ? questions[subIndex] : null;
        if (!question || !question.answerForm) return false;

        for (const field of question.answerForm) {
          const val = state.answers[field.id];
          if (val && val !== "") return true;
        }
        return false;
      }

      /** タブ内に未回答の小問があるか */
      function hasUnansweredInTab(tabNum) {
        if (tabNum === 1) {
          for (let i = 0; i < state.exam.q1.length; i++) {
            if (!isQ1SubAnswered(i)) return true;
          }
          return false;
        }
        const questions = state.exam["q" + tabNum];
        if (!questions) return true;
        for (let i = 0; i < questions.length; i++) {
          if (!isBigQSubAnswered(tabNum, i)) return true;
        }
        return false;
      }

      // ============================================================
      // タブボタンの状態更新
      // ============================================================

      function updateTabButtons() {
        document.querySelectorAll(".tab-btn").forEach((btn) => {
          const qNum = parseInt(btn.dataset.question);
          btn.classList.toggle("active", qNum === state.currentTab);

          // 未回答マーク（●）の表示/非表示
          const hasUnanswered = hasUnansweredInTab(qNum);
          let mark = btn.querySelector(".unanswered-mark");
          if (hasUnanswered) {
            if (!mark) {
              mark = document.createElement("span");
              mark.className = "unanswered-mark";
              btn.appendChild(mark);
            }
          } else {
            if (mark) mark.remove();
          }
        });
      }

      // ============================================================
      // 問題描画
      // ============================================================

      /** 現在のタブ・小問に応じて問題を描画 */
      function renderCurrentQuestion() {
        saveCurrentAnswers();

        const tab = state.currentTab;
        const subQ = state.currentSubQ;
        const questionArea = document.getElementById("question-area");
        const subNavEl = document.getElementById("sub-question-nav");
        const reviewCheckArea = document.getElementById("review-check-area");
        const subNavButtons = document.getElementById("sub-nav-buttons");

        if (tab === 1) {
          renderQ1(subQ, questionArea, subNavEl, reviewCheckArea, subNavButtons);
        } else {
          renderBigQuestion(
            tab, subQ, state.exam["q" + tab],
            questionArea, subNavEl, reviewCheckArea, subNavButtons
          );
        }

        // トレーニングモード時の解説エリア・ボタン制御
        const actionArea = document.getElementById("training-action-area");
        const explanationArea = document.getElementById("explanation-area");

        if (state.mode === "training") {
          actionArea.style.display = "block";
          const key = "q" + tab + "-" + subQ;
          if (state.checkedQuestions[key]) {
            showSingleExplanation(tab, subQ);
          } else {
            explanationArea.style.display = "none";
          }
        } else {
          actionArea.style.display = "none";
          explanationArea.style.display = "none";
        }

        updateTabButtons();

        // メインエリアをトップにスクロール
        document.getElementById("exam-main").scrollTop = 0;
        window.scrollTo(0, 0);
      }

      // ---- 第1問: 仕訳問題の描画 ----

      function renderQ1(subIndex, questionArea, subNavEl, reviewCheckArea, subNavButtons) {
        const question = state.exam.q1[subIndex];
        if (!question) return;

        const totalSub = state.exam.q1.length;

        // 小問インジケーター（ドット）
        let dotsHTML = "";
        for (let i = 0; i < totalSub; i++) {
          const key = "q1-" + i;
          let cls = "sub-q-dot";
          if (i === subIndex) cls += " active";
          if (isQ1SubAnswered(i)) cls += " answered";
          if (state.reviewFlags[key]) cls += " flagged";
          dotsHTML += '<span class="' + cls + '" data-sub="' + i + '"></span>';
        }

        subNavEl.innerHTML =
          '<span class="sub-q-label">第1問 (' + (subIndex + 1) + ') / 全' + totalSub + '問</span>' +
          '<span class="sub-q-indicator">' + dotsHTML + "</span>";

        // ドットクリックでジャンプ
        subNavEl.querySelectorAll(".sub-q-dot").forEach((dot) => {
          dot.addEventListener("click", function () {
            saveCurrentAnswers();
            state.currentSubQ = parseInt(this.dataset.sub);
            renderCurrentQuestion();
          });
        });

        // 借方・貸方の行数を算出
        const debitEntries = question.answers.filter((a) => a.side === "debit");
        const creditEntries = question.answers.filter((a) => a.side === "credit");
        const rowCount = Math.max(debitEntries.length, creditEntries.length);

        // 仕訳テーブル生成
        // 本番CBT同様、問題ごとに絞り込まれた勘定科目選択肢(choices)を使用
        // 選択肢を動的生成（キャッシュして同じ問題では同じ選択肢を維持）
        if (!state.q1Choices) state.q1Choices = {};
        if (!state.q1Choices[subIndex]) {
          state.q1Choices[subIndex] = generateQ1Choices(question);
        }
        var choiceList = state.q1Choices[subIndex];
        let rowsHTML = "";
        for (let r = 0; r < rowCount; r++) {
          var dAccId = "q1-" + subIndex + "-debit-" + r + "-account";
          var dAmtId = "q1-" + subIndex + "-debit-" + r + "-amount";
          var cAccId = "q1-" + subIndex + "-credit-" + r + "-account";
          var cAmtId = "q1-" + subIndex + "-credit-" + r + "-amount";

          rowsHTML += "<tr>";
          // 借方科目
          rowsHTML += "<td><select id=\"" + dAccId + "\"><option value=\"\">---</option>";
          for (var ai = 0; ai < choiceList.length; ai++) {
            rowsHTML += "<option value=\"" + choiceList[ai] + "\">" + choiceList[ai] + "</option>";
          }
          rowsHTML += "</select></td>";
          // 借方金額
          rowsHTML += "<td><input type=\"text\" id=\"" + dAmtId + "\" inputmode=\"numeric\" placeholder=\"金額\"></td>";
          // 貸方科目
          rowsHTML += "<td><select id=\"" + cAccId + "\"><option value=\"\">---</option>";
          for (var ai2 = 0; ai2 < choiceList.length; ai2++) {
            rowsHTML += "<option value=\"" + choiceList[ai2] + "\">" + choiceList[ai2] + "</option>";
          }
          rowsHTML += "</select></td>";
          // 貸方金額
          rowsHTML += "<td><input type=\"text\" id=\"" + cAmtId + "\" inputmode=\"numeric\" placeholder=\"金額\"></td>";
          rowsHTML += "</tr>";
        }

        questionArea.innerHTML =
          "<h2>第1問 - 仕訳問題 (" + (subIndex + 1) + ")</h2>" +
          '<div class="journal-question-text">' + question.text + "</div>" +
          '<table class="journal-entry-table">' +
          "<thead><tr><th>借方科目</th><th>金額</th><th>貸方科目</th><th>金額</th></tr></thead>" +
          "<tbody>" + rowsHTML + "</tbody></table>";

        // 保存済み回答の復元
        restoreQ1Answers(subIndex, rowCount);

        // 金額入力のフォーマット制御
        setupNumberInputs(questionArea);

        // 見直しチェックボックス
        var reviewKey = "q1-" + subIndex;
        reviewCheckArea.innerHTML =
          "<label><input type=\"checkbox\" id=\"review-" + reviewKey + "\"" +
          (state.reviewFlags[reviewKey] ? " checked" : "") +
          "> あとで見直す</label>";
        document.getElementById("review-" + reviewKey).addEventListener("change", function (e) {
          state.reviewFlags[reviewKey] = e.target.checked;
          updateTabButtons();
        });

        // 前の問題 / 次の問題 ボタン
        subNavButtons.innerHTML =
          '<button id="btn-prev-sub"' + (subIndex === 0 ? " disabled" : "") + ">前の問題</button>" +
          '<button id="btn-next-sub"' + (subIndex === totalSub - 1 ? " disabled" : "") + ">次の問題</button>";

        document.getElementById("btn-prev-sub").addEventListener("click", function () {
          if (state.currentSubQ > 0) {
            saveCurrentAnswers();
            state.currentSubQ--;
            renderCurrentQuestion();
          }
        });
        document.getElementById("btn-next-sub").addEventListener("click", function () {
          if (state.currentSubQ < totalSub - 1) {
            saveCurrentAnswers();
            state.currentSubQ++;

      // ---- 第2〜5問: contentHTMLベースの問題描画 ----

      function renderBigQuestion(tabNum, subIndex, questions, questionArea, subNavEl, reviewCheckArea, subNavButtons) {
        if (!questions || questions.length === 0) return;
        var totalSub = questions.length;
        var question = questions[subIndex];
        if (!question) return;

        // 小問ナビゲーション
        if (totalSub > 1) {
          var dotsHTML = "";
          for (var i = 0; i < totalSub; i++) {
            var key = "q" + tabNum + "-" + i;
            var cls = "sub-q-dot";
            if (i === subIndex) cls += " active";
            if (isBigQSubAnswered(tabNum, i)) cls += " answered";
            if (state.reviewFlags[key]) cls += " flagged";
            dotsHTML += '<span class="' + cls + '" data-sub="' + i + '"></span>';
          }
          subNavEl.innerHTML =
            '<span class="sub-q-label">第' + tabNum + '問 (' + (subIndex + 1) + ') / 全' + totalSub + '問</span>' +
            '<span class="sub-q-indicator">' + dotsHTML + "</span>";

          subNavEl.querySelectorAll(".sub-q-dot").forEach(function (dot) {
            dot.addEventListener("click", function () {
              saveCurrentAnswers();
              state.currentSubQ = parseInt(this.dataset.sub);
              renderCurrentQuestion();
            });
          });
        } else {
          subNavEl.innerHTML = '<span class="sub-q-label">第' + tabNum + "問</span>";
        }

        // contentHTML内の {{blank:xxx}} を実際の入力要素に置換
        var html = question.contentHTML;
        html = html.replace(/\{\{blank:([^}]+)\}\}/g, function (match, blankId) {
          var formItem = null;
          for (var fi = 0; fi < question.answerForm.length; fi++) {
            if (question.answerForm[fi].id === blankId) {
              formItem = question.answerForm[fi];
              break;
            }
          }
          if (!formItem) return match;

          if (formItem.type === "number") {
            return '<input type="text" id="' + blankId + '" inputmode="numeric" class="blank-input" placeholder="金額">';
          } else if (formItem.type === "select") {
            var opts = formItem.options || accountList;
            var selectHTML = '<select id="' + blankId + '" class="blank-select"><option value="">---</option>';
            for (var oi = 0; oi < opts.length; oi++) {
              selectHTML += '<option value="' + opts[oi] + '">' + opts[oi] + "</option>";
            }
            selectHTML += "</select>";
            return selectHTML;
          }
          return match;
        });

        questionArea.innerHTML =
          "<h2>第" + tabNum + "問</h2>" +
          '<p style="margin-bottom:12px; font-weight:600;">' + question.title + "</p>" +
          html;

        // 保存済み回答の復元
        restoreBigQAnswers(question);

        // 金額入力のフォーマット制御
        setupNumberInputs(questionArea);

        // 見直しチェックボックス
        var reviewKey = "q" + tabNum + "-" + subIndex;
        reviewCheckArea.innerHTML =
          "<label><input type=\"checkbox\" id=\"review-" + reviewKey + "\"" +
          (state.reviewFlags[reviewKey] ? " checked" : "") +
          "> あとで見直す</label>";
        document.getElementById("review-" + reviewKey).addEventListener("change", function (e) {
          state.reviewFlags[reviewKey] = e.target.checked;
          updateTabButtons();
        });

        // 前の問題 / 次の問題 ボタン（小問が2問以上の場合のみ）
        if (totalSub > 1) {
          subNavButtons.innerHTML =
            '<button id="btn-prev-sub"' + (subIndex === 0 ? " disabled" : "") + ">前の問題</button>" +
            '<button id="btn-next-sub"' + (subIndex === totalSub - 1 ? " disabled" : "") + ">次の問題</button>";

          document.getElementById("btn-prev-sub").addEventListener("click", function () {
            if (state.currentSubQ > 0) {
              saveCurrentAnswers();
              state.currentSubQ--;
              renderCurrentQuestion();
            }
          });
          document.getElementById("btn-next-sub").addEventListener("click", function () {
            if (state.currentSubQ < totalSub - 1) {
              saveCurrentAnswers();
              state.currentSubQ++;
              renderCurrentQuestion();
            }
          });
        } else {
          subNavButtons.innerHTML = "";
        }
      }
      // 単問採点・解説表示（トレーニングモード用）
      // ============================================================

      function showSingleExplanation(tabNum, subIndex) {
        saveCurrentAnswers();
        const key = "q" + tabNum + "-" + subIndex;
        state.checkedQuestions[key] = true;

        const explanationArea = document.getElementById("explanation-area");
        explanationArea.style.display = "block";

        let isCorrect = false;
        let question = null;
        let expText = "";

        if (tabNum === 1) {
          question = state.exam.q1[subIndex];
          if (question) {
            const correctDebits = question.answers.filter((a) => a.side === "debit");
            const correctCredits = question.answers.filter((a) => a.side === "credit");
            const rowCount = Math.max(correctDebits.length, correctCredits.length);

            const userDebits = [];
            const userCredits = [];
            for (let r = 0; r < rowCount; r++) {
              const dAcc = state.answers["q1-" + subIndex + "-debit-" + r + "-account"] || "";
              const dAmt = parseAmount(state.answers["q1-" + subIndex + "-debit-" + r + "-amount"]);
              if (dAcc !== "" && !isNaN(dAmt)) userDebits.push({ account: dAcc, amount: dAmt });

              const cAcc = state.answers["q1-" + subIndex + "-credit-" + r + "-account"] || "";
              const cAmt = parseAmount(state.answers["q1-" + subIndex + "-credit-" + r + "-amount"]);
              if (cAcc !== "" && !isNaN(cAmt)) userCredits.push({ account: cAcc, amount: cAmt });
            }

            isCorrect = matchEntries(userDebits, correctDebits) && matchEntries(userCredits, correctCredits);
            expText = question.explanation || "解説はありません。";
          }
        } else {
          const questions = state.exam["q" + tabNum];
          question = questions ? questions[subIndex] : null;
          if (question && question.answerForm) {
            let allCorrect = true;
            question.answerForm.forEach((field) => {
              const userAnswer = state.answers[field.id] || "";
              if (field.type === "number") {
                const userNum = parseAmount(userAnswer);
                if (isNaN(userNum) || userNum !== field.correctAnswer) allCorrect = false;
              } else {
                if (userAnswer !== field.correctAnswer) allCorrect = false;
              }
            });
            isCorrect = allCorrect;
            expText = question.explanation || "解説はありません。";
          }
        }

        if (question && !isCorrect) {
          if (!wrongQuestionsHistory.includes(question.id)) {
            wrongQuestionsHistory.push(question.id);
          }
        }

        explanationArea.innerHTML =
          '<div class="explanation-title ' + (isCorrect ? "correct" : "incorrect") + '">' +
          (isCorrect ? "【正解 ✓】" : "【不正解 ✗】") + "</div>" +
          '<div class="explanation-text">' + expText + "</div>";
      }

      // ============================================================
      // 見直し一覧モーダル
      // ============================================================

      function renderReviewList() {
        var listBody = document.getElementById("review-list-body");
        var html = "";

        var qLabels = {
          1: "仕訳問題",
          2: "商業簿記 個別",
          3: "商業簿記 決算",
          4: "工業簿記",
          5: "工業簿記 総合",
        };

        for (var q = 1; q <= 5; q++) {
          html += '<div class="review-list-section">';
          html += '<div class="review-list-section-title">第' + q + "問 - " + qLabels[q] + "</div>";

          var questions;
          if (q === 1) {
            questions = state.exam.q1;
            for (var i = 0; i < questions.length; i++) {
              html += buildReviewItem(q, i, "問" + (i + 1));
            }
          } else {
            questions = state.exam["q" + q];
            for (var j = 0; j < questions.length; j++) {
              var label = questions.length > 1 ? "問" + (j + 1) : "問題";
              html += buildReviewItem(q, j, label);
            }
          }
          html += "</div>";
        }

        listBody.innerHTML = html;

        // クリックで該当箇所にジャンプ
        listBody.querySelectorAll(".review-list-item").forEach(function (item) {
          item.addEventListener("click", function () {
            saveCurrentAnswers();
            state.currentTab = parseInt(this.dataset.tab);
            state.currentSubQ = parseInt(this.dataset.sub);
            closeModal("modal-review");
            renderCurrentQuestion();
          });
        });
      }

      function buildReviewItem(tabNum, subIndex, label) {
        var key = "q" + tabNum + "-" + subIndex;
        var answered =
          tabNum === 1
            ? isQ1SubAnswered(subIndex)
            : isBigQSubAnswered(tabNum, subIndex);
        var flagged = state.reviewFlags[key] || false;

        var statusClass, statusText;
        if (flagged) {
          statusClass = "status-flagged";
          statusText = "見直し";
        } else if (answered) {
          statusClass = "status-answered";
          statusText = "回答済";
        } else {
          statusClass = "status-unanswered";
          statusText = "未回答";
        }

        return (
          '<div class="review-list-item" data-tab="' + tabNum + '" data-sub="' + subIndex + '">' +
          '<span class="review-list-item-label">' + label + "</span>" +
          '<span class="review-list-item-status ' + statusClass + '">' + statusText + "</span>" +
          "</div>"
        );
      }

      // ============================================================
      // モーダル管理
      // ============================================================

      function openModal(id) {
        document.getElementById(id).classList.add("active");
      }

      function closeModal(id) {
        document.getElementById(id).classList.remove("active");
